# База, одноразовий крок seed і застосунок. Запуск: docker compose up --build
# Крок seed застосовує міграції і наповнює порожню базу прикладами, тож після npm run up дані вже є.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: library
      POSTGRES_PASSWORD: library
      POSTGRES_DB: library
    ports:
      - "${PG_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U library -d library"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Одноразовий крок: міграції + стартові дані (npm run seed). Якщо автори вже є, нічого не робить,
  # тож повторний запуск безпечний. Збирається зі стадії build, бо там є ts-node і вихідний код.
  seed:
    build:
      context: .
      target: build
    command: ["npm", "run", "seed"]
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: library
      DB_PASSWORD: library
      DB_NAME: library
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build: .
    ports:
      - "${APP_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    environment:
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: library
      DB_PASSWORD: library
      DB_NAME: library
    # Застосунок стартує тільки після того, як база відповіла на pg_isready
    # і seed успішно завершився.
    depends_on:
      postgres:
        condition: service_healthy
      seed:
        condition: service_completed_successfully

volumes:
  pgdata:
